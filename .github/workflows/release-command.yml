name: Maintainer Release Command

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: maintainer-release
  cancel-in-progress: false

jobs:
  release:
    if: github.actor == github.repository_owner && startsWith(github.event.issue.title, 'Release v')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Parse and validate release command
        id: release
        env:
          COMMAND: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        shell: bash
        run: |
          if [[ ! "$COMMAND" =~ ^/release[[:space:]]+(v[0-9]+\.[0-9]+\.[0-9]+)[[:space:]]*$ ]]; then
            echo "::error::Issue body must contain only: /release vMAJOR.MINOR.PATCH"
            exit 1
          fi

          TAG="${BASH_REMATCH[1]}"
          if [ "$ISSUE_TITLE" != "Release $TAG" ]; then
            echo "::error::Issue title must be exactly: Release $TAG"
            exit 1
          fi

          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${TAG#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PACKAGE_VERSION) does not match requested tag ($TAG_VERSION)"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Run complete release validation
        run: npm run release:validate

      - name: Create and push annotated release tag
        if: steps.release.outputs.tag_exists != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Development Kit $TAG"
          git push origin "$TAG"

      - name: Verify existing release tag
        if: steps.release.outputs.tag_exists == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG" --force
          TAG_COMMIT=$(git rev-list -n 1 "$TAG")
          if ! git merge-base --is-ancestor "$TAG_COMMIT" HEAD; then
            echo "::error::Existing tag $TAG is not contained in the current main branch"
            exit 1
          fi

      - name: Create GitHub Release
        id: github-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            gh release create "$TAG" --verify-tag --generate-notes --title "Development Kit $TAG"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
          RELEASE_URL=$(gh release view "$TAG" --json url --jq '.url')
          echo "url=$RELEASE_URL" >> "$GITHUB_OUTPUT"

      - name: Detect npm publishing credentials
        id: npm-auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package from release tag when credentials are configured
        id: npm-publish
        if: steps.npm-auth.outputs.configured == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          git checkout --detach "$TAG"
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "status=already-published" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          npm publish --access public
          PUBLISH_STATUS=$?
          set -e

          if [ "$PUBLISH_STATUS" -eq 0 ]; then
            echo "status=published" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::GitHub Release was created, but npm publication failed. Configure or verify NPM_TOKEN and package ownership before retrying npm publication."
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Confirm public release
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_URL: ${{ steps.github-release.outputs.url }}
          NPM_CONFIGURED: ${{ steps.npm-auth.outputs.configured }}
          NPM_STATUS: ${{ steps.npm-publish.outputs.status }}
        run: |
          if [ "$NPM_CONFIGURED" = "true" ]; then
            NPM_NOTE="npm status: ${NPM_STATUS:-not-reported}."
          else
            NPM_NOTE="npm publication was skipped because NPM_TOKEN is not configured."
          fi

          gh issue comment "$ISSUE_NUMBER" --body "Public release \`$TAG\` is available at $RELEASE_URL. $NPM_NOTE"
          gh issue close "$ISSUE_NUMBER" --reason completed
