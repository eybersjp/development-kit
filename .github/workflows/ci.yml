name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate skills and agents
        run: node scripts/validate-skills.mjs

      - name: Check plugin manifest sync
        run: node scripts/sync-plugin.mjs --check
