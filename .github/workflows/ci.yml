name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate skills and agents
        run: npm run validate

      - name: Check plugin manifest synchronization
        run: npm run doctor

      - name: Test plugin synchronization invariants
        run: npm run sync:validate:test

      - name: Validate installer integrity
        run: npm run installer:validate:test

      - name: Validate Development Contract orchestration foundation
        run: npm run orchestration:validate

      - name: Validate execution safety foundation
        run: npm run execution-safety:validate

      - name: Validate evidence and control coverage
        run: npm run evidence:validate

      - name: Validate core orchestration runtime
        run: npm run orchestration-core:validate

      - name: Validate orchestration command integration
        run: npm run orchestration-integration:validate

      - name: Validate v0.9 reliability regressions
        run: npm run v09-reliability:validate

      - name: Validate documentation
        run: npm run docs:validate

      - name: Test documentation validator
        run: npm run docs:validate:test

      - name: Validate OpenCode configuration
        run: npm run opencode:validate

      - name: Validate platform template adapters
        run: npm run platform:validate

      - name: Validate external research contract
        run: npm run research:validate

      - name: Validate v0.7.1 regression suite
        run: npm run v071:validate

      - name: Validate Live UI Preview runtime
        run: npm run ui-preview:test

      - name: Validate token and context efficiency
        run: |
          npm run token-efficiency:test
          npm run token:audit:check

      - name: Run Scale/Context Phase 0-1 baseline
        run: node scripts/phase01-scale-context-baseline.mjs

      - name: Validate Scale/Context v0.12 Phase 2 PLAN
        run: node scripts/phase02-scale-context-plan-validate.mjs

      - name: Validate v0.12 Cost Observatory increment
        run: npm run cost-observatory:test

      - name: Validate v0.12 Workspace Target Engine increment
        run: npm run workspace-targets:test

      - name: Validate v0.12 Execution Capsules & Context Cache increment
        run: npm run execution-capsule:test

      - name: Validate v0.12 reduced-release scope
        if: ${{ github.head_ref != 'feature/v0.13-state-engine-v2' && github.head_ref != 'test/v013-t04-acl-port-20261030' }}
        run: npm run release-scope:v012

      - name: Validate v0.13 State Engine V2 increment
        if: ${{ github.head_ref == 'feature/v0.13-state-engine-v2' || github.head_ref == 'test/v013-t04-acl-port-20261030' }}
        run: npm run v013-state-engine-v2:test

      - name: Validate v0.12 non-T04 feature increments
        run: |
          npm run lifecycle-instances:test
          npm run discovery-reentry:test
          npm run gate-profiles:test
          npm run verification-extension-sdk:test
          npm run complexity-delta:test
          npm run control-center-v012:test

      - name: Validate Design Authority governance
        run: npm run design-authority:validate

      - name: Validate Autopilot runtime and evaluations
        run: npm run autopilot:validate

      - name: Verify npm package distribution inventory
        run: npm pack --dry-run

      - name: Verify installed v0.12 consumer package
        if: ${{ github.head_ref != 'feature/v0.13-state-engine-v2' && github.head_ref != 'test/v013-t04-acl-port-20261030' }}
        run: npm run consumer-smoke:v012

      - name: Validate exact release command
        if: ${{ github.head_ref != 'feature/v0.13-state-engine-v2' && github.head_ref != 'test/v013-t04-acl-port-20261030' }}
        run: npm run release:validate

      - name: Validate v0.13 full compatibility regression
        if: ${{ github.head_ref == 'feature/v0.13-state-engine-v2' || github.head_ref == 'test/v013-t04-acl-port-20261030' }}
        run: npm run v013:regression
