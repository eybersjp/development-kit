<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" role="img" aria-labelledby="title desc">
  <title id="title">DKF proof loop</title>
  <desc id="desc">A clean six-step cycle showing Intent, Contract, Execution, Evidence, Verification and Acceptance.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.10"/></filter></defs>
  <rect width="760" height="640" rx="36" fill="#ffffff"/>
  <path d="M380 88c132 0 240 108 240 240S512 568 380 568 140 460 140 328 248 88 380 88z" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="8 10"/>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g><rect x="300" y="52" width="160" height="86" rx="20" fill="#eff6ff" stroke="#bfd4ff"/><text x="380" y="88" font-size="13" font-weight="700" fill="#1d4ed8">01</text><text x="380" y="112" font-size="20" font-weight="700" fill="#0f172a">Intent</text></g>
    <g><rect x="508" y="166" width="160" height="86" rx="20" fill="#ffffff" stroke="#dbe3ee"/><text x="588" y="202" font-size="13" font-weight="700" fill="#1d4ed8">02</text><text x="588" y="226" font-size="20" font-weight="700" fill="#0f172a">Contract</text></g>
    <g><rect x="508" y="388" width="160" height="86" rx="20" fill="#ffffff" stroke="#dbe3ee"/><text x="588" y="424" font-size="13" font-weight="700" fill="#1d4ed8">03</text><text x="588" y="448" font-size="20" font-weight="700" fill="#0f172a">Execution</text></g>
    <g><rect x="300" y="504" width="160" height="86" rx="20" fill="#ecfeff" stroke="#b6ecee"/><text x="380" y="540" font-size="13" font-weight="700" fill="#0f766e">04</text><text x="380" y="564" font-size="20" font-weight="700" fill="#0f172a">Evidence</text></g>
    <g><rect x="92" y="388" width="160" height="86" rx="20" fill="#ffffff" stroke="#dbe3ee"/><text x="172" y="424" font-size="13" font-weight="700" fill="#1d4ed8">05</text><text x="172" y="448" font-size="20" font-weight="700" fill="#0f172a">Verification</text></g>
    <g><rect x="92" y="166" width="160" height="86" rx="20" fill="#0f172a"/><text x="172" y="202" font-size="13" font-weight="700" fill="#93c5fd">06</text><text x="172" y="226" font-size="20" font-weight="800" fill="#ffffff">Acceptance</text></g>
  </g>
  <g stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round"><path d="M463 116c18 10 32 20 45 34"/><path d="M590 258c8 18 13 34 15 55"/><path d="M590 386c-8 18-19 33-34 47"/><path d="M468 525c-18 7-34 11-56 12"/><path d="M290 537c-19-4-35-10-53-20"/><path d="M153 380c-10-18-14-34-17-55"/><path d="M151 258c5-18 11-34 24-51"/><path d="M255 130c18-10 34-15 56-19"/></g>
