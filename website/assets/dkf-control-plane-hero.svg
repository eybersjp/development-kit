<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 720" role="img" aria-labelledby="title desc">
  <title id="title">DKF control plane hero graphic</title>
  <desc id="desc">A clean product-style diagram showing DKF governing autonomous development through contracts, execution, evidence, verification and acceptance.</desc>
  <defs>
    <linearGradient id="frame" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f8fafc"/></linearGradient>
    <linearGradient id="panel" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#172554"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="920" height="720" rx="36" fill="url(#frame)"/>
  <rect x="40" y="40" width="840" height="640" rx="28" fill="#ffffff" stroke="#dbe3ee"/>
  <g filter="url(#shadow)"><rect x="142" y="96" width="636" height="128" rx="26" fill="url(#panel)"/><text x="460" y="144" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#93c5fd" font-weight="700">RELIABILITY CONTROL PLANE</text><text x="460" y="188" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="36" fill="#ffffff" font-weight="800">DKF</text></g>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="112" y="286" width="160" height="108" rx="20" fill="#eff6ff" stroke="#bfd4ff"/><text x="192" y="333" text-anchor="middle" font-size="20" font-weight="700" fill="#1e3a8a">Intent</text><text x="192" y="361" text-anchor="middle" font-size="14" fill="#334155">Goals • Requirements</text>
    <rect x="300" y="286" width="160" height="108" rx="20" fill="#f8fafc" stroke="#dbe3ee"/><text x="380" y="333" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Contract</text><text x="380" y="361" text-anchor="middle" font-size="14" fill="#334155">Authority • Criteria</text>
    <rect x="488" y="286" width="160" height="108" rx="20" fill="#f8fafc" stroke="#dbe3ee"/><text x="568" y="333" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Execution</text><text x="568" y="361" text-anchor="middle" font-size="14" fill="#334155">Scoped agents</text>
    <rect x="676" y="286" width="132" height="108" rx="20" fill="#ecfeff" stroke="#b6ecee"/><text x="742" y="333" text-anchor="middle" font-size="20" font-weight="700" fill="#0f766e">Evidence</text><text x="742" y="361" text-anchor="middle" font-size="14" fill="#334155">Tests • Runtime</text>
  </g>
  <g stroke="#93c5fd" stroke-width="3" fill="none"><path d="M272 340h28"/><path d="M460 340h28"/><path d="M648 340h28"/></g>
  <g filter="url(#shadow)">
    <rect x="168" y="474" width="248" height="132" rx="24" fill="#ffffff" stroke="#dbe3ee"/><text x="292" y="520" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Independent verification</text><text x="292" y="552" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#475569">Review, control coverage, freshness,</text><text x="292" y="576" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#475569">traceability and acceptance checks</text>
    <rect x="494" y="474" width="258" height="132" rx="24" fill="#0f172a"/><text x="623" y="520" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Acceptance</text><text x="623" y="552" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#cbd5e1">Derived from evidence and authority</text>
    <g font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700"><rect x="528" y="570" width="70" height="26" rx="13" fill="#0f766e"/><text x="563" y="588" text-anchor="middle" fill="#ffffff">ACCEPTED</text><rect x="607" y="570" width="66" height="26" rx="13" fill="#334155"/><text x="640" y="588" text-anchor="middle" fill="#ffffff">PENDING</text><rect x="682" y="570" width="60" height="26" rx="13" fill="#b91c1c"/><text x="712" y="588" text-anchor="middle" fill="#ffffff">BLOCKED</text></g>
  </g>
  <g stroke="#64748b" stroke-width="3" fill="none"><path d="M742 394v48c0 12-10 22-22 22H292c-12 0-22 10-22 22v-12"/><path d="M742 394v48c0 12-10 22-22 22H623c-12 0-22 10-22 22v-12"/></g>
</svg>
