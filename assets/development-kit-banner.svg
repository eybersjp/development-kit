    <path d="M18 20H39C45.627 20 51 25.373 51 32V34C51 40.627 45.627 46 39 46H18V20Z" fill="#061221" fill-opacity="0.92"/>
    <path d="M26 28H38C41.314 28 44 30.686 44 34C44 37.314 41.314 40 38 40H26V28Z" fill="url(#accent)"/>
    <circle cx="20" cy="24" r="3" fill="#061221"/>
