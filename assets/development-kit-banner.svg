  <path d="M101 570H1499" stroke="url(#accent)" stroke-opacity="0.32"/>
  <text x="94" y="594" fill="#627894" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="1.2">OPEN SOURCE · MIT LICENSE · BUILT FOR REAL SOFTWARE DELIVERY</text>
