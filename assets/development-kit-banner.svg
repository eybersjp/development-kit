      <text x="56" y="27" text-anchor="middle" fill="#DCD8FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">IMPLEMENT</text>
      <path d="M118 21H142" stroke="#45607E" stroke-width="2"/>
      <path d="M138 16L144 21L138 26" stroke="#45607E" stroke-width="2" fill="none"/>

      <rect x="150" y="0" width="94" height="42" rx="10" fill="#171F3C" stroke="#7166E8" stroke-opacity="0.65"/>
      <text x="197" y="27" text-anchor="middle" fill="#DCD8FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">VERIFY</text>
      <path d="M250 21H274" stroke="#45607E" stroke-width="2"/>
      <path d="M270 16L276 21L270 26" stroke="#45607E" stroke-width="2" fill="none"/>

      <rect x="282" y="0" width="96" height="42" rx="10" fill="#171F3C" stroke="#7166E8" stroke-opacity="0.65"/>
      <text x="330" y="27" text-anchor="middle" fill="#DCD8FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">REVIEW</text>
      <path d="M384 21H408" stroke="#45607E" stroke-width="2"/>
      <path d="M404 16L410 21L404 26" stroke="#45607E" stroke-width="2" fill="none"/>

      <rect x="416" y="0" width="106" height="42" rx="10" fill="#122B38" stroke="#2BD8F0" stroke-opacity="0.65"/>
      <text x="469" y="27" text-anchor="middle" fill="#BDF7FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">SHIP</text>
