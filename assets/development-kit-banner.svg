<svg width="1600" height="620" viewBox="0 0 1600 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DKF — Reliability control plane for agentic software development</title>
  <desc id="desc">Development Kit Framework banner emphasizing contract-driven, evidence-backed, deterministic acceptance for AI software development.</desc>
  <defs>
    <linearGradient id="bg" x1="70" y1="10" x2="1530" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06111E"/>
      <stop offset="0.52" stop-color="#0A1730"/>
      <stop offset="1" stop-color="#12142C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#48E4FF"/>
      <stop offset="1" stop-color="#8C79FF"/>
    </linearGradient>
    <linearGradient id="panel" x1="925" y1="90" x2="1490" y2="530" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10213B"/>
      <stop offset="1" stop-color="#0A1327"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#B0CCF5" stroke-opacity="0.05"/>
    </pattern>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="1600" height="620" rx="32" fill="url(#bg)"/>
  <rect width="1600" height="620" rx="32" fill="url(#grid)"/>
  <circle cx="1420" cy="70" r="220" fill="#7866FF" fill-opacity="0.1" filter="url(#glow)"/>
  <circle cx="220" cy="620" r="270" fill="#36DFFF" fill-opacity="0.07" filter="url(#glow)"/>

  <g transform="translate(88 78)">
    <rect width="78" height="78" rx="20" fill="url(#accent)"/>
    <path d="M21 23H46C54.284 23 61 29.716 61 38V40C61 48.284 54.284 55 46 55H21V23Z" fill="#071421"/>
    <path d="M31 32H45C49.418 32 53 35.582 53 40C53 44.418 49.418 48 45 48H31V32Z" fill="url(#accent)"/>
    <circle cx="23" cy="28" r="3.5" fill="#071421"/>
    <circle cx="23" cy="51" r="3.5" fill="#071421"/>
  </g>

  <text x="190" y="112" fill="#C6D8F1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="760" letter-spacing="4">DEVELOPMENT KIT FRAMEWORK</text>
  <text x="190" y="145" fill="#7188A7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="2.2">DKF · OPEN SOURCE · MIT</text>

  <text x="88" y="242" fill="#F6F9FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="62" font-weight="780" letter-spacing="-2">The reliability control plane</text>
  <text x="88" y="309" fill="#F6F9FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="62" font-weight="780" letter-spacing="-2">for agentic software development.</text>

  <text x="91" y="371" fill="#B3C4DA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="650">AI can write it. <tspan fill="#62E9FA">DKF proves it.</tspan></text>
  <text x="91" y="410" fill="#849BB8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">Contracts · independent verification · provenance · deterministic acceptance</text>

  <g transform="translate(91 454)">
    <rect x="0" y="0" width="148" height="42" rx="21" fill="#11243B" stroke="#2E4B69"/>
    <text x="74" y="27" text-anchor="middle" fill="#CDE1F7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">v0.10 baseline</text>
    <rect x="160" y="0" width="130" height="42" rx="21" fill="#11243B" stroke="#2E4B69"/>
    <text x="225" y="27" text-anchor="middle" fill="#CDE1F7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">16 commands</text>
    <rect x="302" y="0" width="120" height="42" rx="21" fill="#11243B" stroke="#2E4B69"/>
    <text x="362" y="27" text-anchor="middle" fill="#CDE1F7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">18 agents</text>
    <rect x="434" y="0" width="110" height="42" rx="21" fill="#11243B" stroke="#2E4B69"/>
    <text x="489" y="27" text-anchor="middle" fill="#CDE1F7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">47 skills</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="918" y="82" width="602" height="456" rx="24" fill="url(#panel)" stroke="#2A4567"/>
    <rect x="918" y="82" width="602" height="56" rx="24" fill="#14243E"/>
    <rect x="918" y="112" width="602" height="26" fill="#14243E"/>
    <circle cx="952" cy="110" r="6" fill="#FF6B6B"/>
    <circle cx="974" cy="110" r="6" fill="#FFD166"/>
    <circle cx="996" cy="110" r="6" fill="#5DE2A7"/>
    <text x="1218" y="116" text-anchor="middle" fill="#7F99BA" font-family="JetBrains Mono, Consolas, monospace" font-size="14">dkf / acceptance</text>

    <text x="958" y="184" fill="#54E7FA" font-family="JetBrains Mono, Consolas, monospace" font-size="17" font-weight="700">$ /dk-autopilot</text>
    <text x="958" y="220" fill="#DCE8F8" font-family="JetBrains Mono, Consolas, monospace" font-size="15">Development Contract bound</text>
    <text x="958" y="248" fill="#8099B9" font-family="JetBrains Mono, Consolas, monospace" font-size="14">authoritative sources fingerprinted</text>

    <g transform="translate(960 286)">
      <rect width="150" height="46" rx="11" fill="#102C37" stroke="#3BA9BB"/>
      <text x="75" y="29" text-anchor="middle" fill="#C9F7FC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="760">CONTRACT</text>
      <path d="M160 23H198" stroke="#486A89" stroke-width="2"/>
      <path d="M192 17L200 23L192 29" fill="none" stroke="#486A89" stroke-width="2"/>
      <rect x="210" width="150" height="46" rx="11" fill="#121F3C" stroke="#655EC2"/>
      <text x="285" y="29" text-anchor="middle" fill="#E2DFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="760">IMPLEMENT</text>
      <path d="M370 23H408" stroke="#486A89" stroke-width="2"/>
      <path d="M402 17L410 23L402 29" fill="none" stroke="#486A89" stroke-width="2"/>
      <rect x="420" width="142" height="46" rx="11" fill="#102C37" stroke="#3BA9BB"/>
      <text x="491" y="29" text-anchor="middle" fill="#C9F7FC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="760">EVIDENCE</text>
    </g>

    <g transform="translate(960 354)">
      <rect width="170" height="46" rx="11" fill="#121F3C" stroke="#655EC2"/>
      <text x="85" y="29" text-anchor="middle" fill="#E2DFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="760">INDEPENDENT VERIFY</text>
      <path d="M180 23H218" stroke="#486A89" stroke-width="2"/>
      <path d="M212 17L220 23L212 29" fill="none" stroke="#486A89" stroke-width="2"/>
      <rect x="230" width="170" height="46" rx="11" fill="#121F3C" stroke="#655EC2"/>
      <text x="315" y="29" text-anchor="middle" fill="#E2DFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="760">AUTHORITY GRAPH</text>
      <path d="M410 23H448" stroke="#486A89" stroke-width="2"/>
      <path d="M442 17L450 23L442 29" fill="none" stroke="#486A89" stroke-width="2"/>
      <rect x="460" width="102" height="46" rx="11" fill="#11302B" stroke="#41B79A"/>
      <text x="511" y="29" text-anchor="middle" fill="#C7F8E7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">ACCEPT</text>
    </g>

    <line x1="960" y1="431" x2="1478" y2="431" stroke="#29415E"/>
    <circle cx="972" cy="475" r="7" fill="#5DE2A7"/>
    <text x="992" y="481" fill="#A6BAD2" font-family="JetBrains Mono, Consolas, monospace" font-size="14">completion is computed, not claimed</text>
    <text x="960" y="515" fill="#7088A7" font-family="JetBrains Mono, Consolas, monospace" font-size="13">roadmap: adaptive · proof · enforcement · scale</text>
  </g>

  <path d="M91 558H1509" stroke="url(#accent)" stroke-opacity="0.32"/>
  <text x="91" y="589" fill="#617895" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="650" letter-spacing="1.1">AGENT-INDEPENDENT · EVIDENCE-BACKED · FAIL-CLOSED · BUILT FOR REAL SOFTWARE DELIVERY</text>
</svg>
