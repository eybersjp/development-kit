      <text x="330" y="27" text-anchor="middle" fill="#DCD8FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">DESIGN</text>
      <path d="M384 21H408" stroke="#45607E" stroke-width="2"/>
      <path d="M404 16L410 21L404 26" stroke="#45607E" stroke-width="2" fill="none"/>

      <rect x="416" y="0" width="106" height="42" rx="10" fill="#171F3C" stroke="#7166E8" stroke-opacity="0.65"/>
      <text x="469" y="27" text-anchor="middle" fill="#DCD8FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">PLAN</text>
