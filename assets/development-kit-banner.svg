    <line x1="940" y1="447" x2="1468" y2="447" stroke="#253A56"/>
    <circle cx="950" cy="487" r="7" fill="#5DE2A7"/>
    <text x="970" y="493" fill="#9FB3CC" font-family="JetBrains Mono, Consolas, monospace" font-size="15">verification-first · approval-gated · resumable</text>
