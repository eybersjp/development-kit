  <text x="92" y="222" fill="#F6F9FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="70" font-weight="760" letter-spacing="-2.5">Engineering discipline</text>
  <text x="92" y="296" fill="#F6F9FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="70" font-weight="760" letter-spacing="-2.5">for AI coding agents.</text>

  <text x="94" y="354" fill="#A9BCD6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="450">Plan deliberately. Build in verified steps. Review against the spec.</text>
  <text x="94" y="389" fill="#A9BCD6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="450">Simplify before shipping.</text>

