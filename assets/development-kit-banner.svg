<svg width="1600" height="620" viewBox="0 0 1600 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Development Kit</title>
  <desc id="desc">A professional banner for Development Kit, an engineering workflow for AI coding agents.</desc>

  <defs>
    <linearGradient id="bg" x1="80" y1="20" x2="1520" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.52" stop-color="#0B1730"/>
      <stop offset="1" stop-color="#11152C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#52E5FF"/>
      <stop offset="1" stop-color="#8B7CFF"/>
    </linearGradient>
    <linearGradient id="panel" x1="920" y1="102" x2="1490" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101F39" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0A1224" stop-opacity="0.96"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#A8C8FF" stroke-opacity="0.055"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1600" height="620" rx="32" fill="url(#bg)"/>
  <rect width="1600" height="620" rx="32" fill="url(#grid)"/>

  <circle cx="1365" cy="55" r="210" fill="#6D5EF7" fill-opacity="0.11" filter="url(#glow)"/>
  <circle cx="260" cy="610" r="260" fill="#27D9FF" fill-opacity="0.08" filter="url(#glow)"/>

  <g transform="translate(92 92)">
